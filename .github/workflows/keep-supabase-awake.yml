# Free Supabase projects pause after a week with no activity.
# This asks Haikudle's server for today's puzzle every 3 days so it never pauses.
# (The key below is the public "publishable" key, the same one in haikudle/config.js.)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Haikudle
        run: |
          curl -fsS -X POST "https://tmitjoctttzeikxpyljg.supabase.co/rest/v1/rpc/today" \
            -H "apikey: sb_publishable_UsL9Zcjtbdenk6vzHrQs7Q_Psgq1rRi" \
            -H "Content-Type: application/json" \
            -H "Content-Profile: haikudle" \
            -d "{}" -o /dev/null -w "Supabase answered: %{http_code}\n"
