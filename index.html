  <style>
    /* Hub: a blue-pages masthead like /games/ */
    .hub { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
    .hero { text-align: center; padding: 22px 0 18px; border-bottom: 3px double var(--ink); }
    .hero .kicker { font-style: normal; font-family: "IBM Plex Mono", var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
    .hero .kicker b { color: var(--red); font-weight: 500; }
    .hero h1 { font-family: "Fraunces", var(--serif); font-weight: 800; font-size: clamp(44px, 10vw, 80px); line-height: .95; letter-spacing: -.02em; margin: 0; color: var(--ink); }
    .hero h1 span { color: var(--red); }
    .hero p { font-family: "Fraunces", var(--serif); font-style: italic; font-size: 20px; color: var(--muted); margin: 12px 0 0; }
    .date { font-family: "IBM Plex Mono", var(--mono); color: var(--ink); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 24px; }
    .game-card {
      display: flex; flex-direction: column; gap: 8px;
      background: var(--panel); border: 1px solid #34477a; border-radius: 0;
      padding: 16px; text-decoration: none; color: var(--ink); min-height: 170px;
      transition: transform .12s, border-color .12s;
    }
    a.game-card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--gold); border-color: var(--gold); }
    .game-card .glyph { font-family: var(--mono); font-size: 1.1rem; letter-spacing: .25em; color: var(--gold); }
    .game-card h2 { font-family: "Fraunces", var(--serif); font-weight: 600; margin: 0; font-size: 1.4rem; }
    .game-card p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
    .game-card .status { font-size: .78rem; font-family: var(--mono); }
    .game-card .status.done { color: var(--hit); }
    .game-card.soon { opacity: .55; border-style: dashed; }
    .game-card .beta { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; vertical-align: middle; margin-left: 6px; }
    footer { margin-top: 40px; color: var(--muted); font-size: .85rem; line-height: 1.9; }
  </style>
</head>
<body>

    </div>

  <main class="hub">
    <section class="hero">
      <p class="kicker">Roman Serius <b>·</b> The blue pages</p>
      <h1>Daily Games</h1>
      <p>Small puzzles. One a day, same for everyone.</p>
      <div class="date" id="today"></div>
    </section>

    <section class="grid" id="games"></section>

    <footer>
      <a href="contact/">Suggest a word, a dilemma, or anything else</a><br>
      Made by <a href="https://romanserius.com/">Roman Serius</a> ·
      <a href="https://intothevoidpress.substack.com">Into the Void</a>
    </footer>
  </main>

  <script src="shared/daily.js"></script>
  <script src="shared/games.js"></script>
  <script src="shared/analytics.js"></script>
  <script>
    // Games are listed in shared/games.js.
    const GAMES = window.GAMES;

    const day = Daily.dayNumber();
    document.getElementById("today").textContent =
      `No. ${day} · ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}`;

    document.getElementById("games").innerHTML = GAMES.map((g) => {
      if (g.status !== "live") {
        return `<div class="game-card soon"><div class="glyph">${g.glyph}</div><h2>${g.name}</h2><p>${g.blurb}</p><div class="status">coming soon · <a href="contact/?game=${g.id}">send an idea</a></div></div>`;
      }
      const s = Daily.loadDay(g.id, day);
      const done = s && s.status && s.status !== "playing";
      const streak = Daily.stats(g.id).streak;
      const label = done ? `✓ played today${streak ? ` · ${streak}🔥` : ""}` : "play today's →";
      return `<a class="game-card" href="${g.id}/"><div class="glyph">${g.glyph}</div><h2>${g.name}${g.beta ? ' <span class="beta">beta</span>' : ""}</h2><p>${g.blurb}</p><div class="status${done ? " done" : ""}">${label}</div></a>`;
    }).join("");
  </script>
</body>
